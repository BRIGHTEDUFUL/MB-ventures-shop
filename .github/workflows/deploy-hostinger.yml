name: Deploy to Hostinger

# This workflow is DISABLED — Hostinger's built-in Git auto-deployment
# handles deploys automatically when code is pushed to main.
# See: Hostinger panel → Websites → mbventuresghana.com → Git
#
# To re-enable SSH-based deploys, add these secrets to the GitHub repo:
#   HOSTINGER_HOST, HOSTINGER_USERNAME, HOSTINGER_PASSWORD, HOSTINGER_PATH

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm manual SSH deployment'
        required: true
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DEPLOY'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 22
          script: |
            cd ${{ secrets.HOSTINGER_PATH }}
            git pull origin main
            npm ci
            npm run build
            pm2 restart mb-ventures-gh || pm2 start ecosystem.config.js
            pm2 save
            echo "✅ Deployment complete!"
            pm2 status
